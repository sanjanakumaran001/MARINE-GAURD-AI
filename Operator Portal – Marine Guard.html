  <style>
    body {
      background: linear-gradient(135deg, #071B33 0%, #06284F 50%, #040F1D 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .auth-header {
      background: #071B33;
      padding: 2.25rem 2rem;
      text-align: center;
      color: white;
      border-bottom: 2px solid var(--accent-cyan);
    }
    .auth-body {
      padding: 2.25rem 2rem;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: var(--transition);
    }
    .auth-tab.active {
      color: var(--secondary-ocean);
      border-bottom-color: var(--secondary-ocean);
    }
    .demo-accounts-box {
      background: rgba(8, 124, 167, 0.08);
      border: 1px dashed var(--secondary-ocean);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1.5rem;
    }
  </style>

<body data-smart-converter-loaded="true">

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon" style="margin: 0 auto 0.75rem;">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h2 style="font-size: 1.4rem; font-weight: 800; letter-spacing: -0.01em;">MARINE GUARD</h2>
      <p style="font-size: 0.78rem; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">
        Maritime SAR Command Center
      </p>
    </div>

    <div class="auth-body">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchAuthTab(&#39;login&#39;)">Sign In</div>
        <div class="auth-tab" id="tab-register" onclick="switchAuthTab(&#39;register&#39;)">Register</div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="operator@marineguard.io" required="" value="admin@marineguard.io">
        </div>

        <div class="form-group">
          <label class="form-label" style="display:flex; justify-content:space-between;">
            Password
            <a href="http://localhost:5000/login.html#" style="color:var(--secondary-ocean); font-size:0.75rem;" onclick="openForgotPassword()">Forgot?</a>
          </label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required="" value="MarineGuard2026!">
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; font-size:0.82rem;">
          <label style="display:flex; align-items:center; gap:0.4rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="remember-me" checked=""> Remember this terminal
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem;">
          Access Rescue Dashboard →
        </button>
      </form>

      <!-- Registration Form (Hidden Initially) -->
      <form id="register-form" style="display:none;">
        <div class="form-group">
          <label class="form-label">Full Name &amp; Title</label>
          <input type="text" id="reg-name" class="form-input" placeholder="Capt. Robert Vance" required="">
        </div>

  <script src="./Operator Portal – Marine Guard_files/api.js.download"></script>
  <script src="./Operator Portal – Marine Guard_files/auth.js.download"></script>
  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');

      if (tab === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
      }
    }

    function fillDemo(role) {
      switchAuthTab('login');
      if (role === 'admin') {
        document.getElementById('login-email').value = 'admin@marineguard.io';
        document.getElementById('login-password').value = 'MarineGuard2026!';
      } else {
        document.getElementById('login-email').value = 'operator@marineguard.io';
        document.getElementById('login-password').value = 'Operator2026!';
      }
      ApiClient.showToast(`Pre-filled ${role.toUpperCase()} credentials. Click 'Access Rescue Dashboard' to sign in.`, 'info');
    }

    function openForgotPassword() {
      alert('For security, password reset requests in demonstration mode are handled by the Chief Administrator (admin@marineguard.io). Please use the Admin Demo account or register a new account.');
    }

    // Handle Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await ApiClient.post('/auth/login', { email, password });
        if (res.success) {
          AuthManager.setSession(res.token, res.user);
          ApiClient.showToast('Login successful! Entering command center...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        }
      } catch (err) {
        ApiClient.showToast(err.message, 'danger');
      }
    });

    // Handle Register
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const role = document.getElementById('reg-role').value;

      try {
        const res = await ApiClient.post('/auth/register', { name, email, password, role });
        if (res.success) {
          AuthManager.setSession(res.token, res.user);
          ApiClient.showToast('Account registered successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        }
      } catch (err) {
        ApiClient.showToast(err.message, 'danger');
      }
    });
  </script>
